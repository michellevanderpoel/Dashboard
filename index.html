<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>My Daily Dashboard</title>
<style>
  :root {
    --bg: #0d0f14;
    --card: #171b24;
    --ink: #eef1f7;
    --muted: #9aa3b5;
    --accent: #7c5cff;
    --accent2: #2dd4bf;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(124,92,255,.18), transparent),
                      radial-gradient(ellipse 60% 40% at 80% 110%, rgba(45,212,191,.10), transparent);
  }
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .orb {
    width: 72px; height: 72px; margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
  }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 10px; }
  p  { font-size: 15px; line-height: 1.6; color: var(--muted); }
  .tag {
    display: inline-block; margin-top: 22px;
    font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent2);
    border: 1px solid rgba(45,212,191,.35);
    border-radius: 999px; padding: 6px 14px;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="orb">🌱</div>
    <h1>Your Daily Dashboard</h1>
    <p>This little corner of the internet is yours. It is standing in for the real thing — your finance goals, health streaks, cat vet dates, news brief and email brief are being built behind the scenes.</p>
    <p style="margin-top:12px">Phase 1 lands here soon.</p>
    <span class="tag">Coming online ✨</span>
  </main>
</body>
</html>
